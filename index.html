<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizBoost AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="home">
    <header>
      <h1>BizBoost AI</h1>
      <p>Apna business badhao 🚀</p>
    </header>
    <input type="text" id="search" placeholder="Search tools...">
    <h2>Tools</h2>
    <div class="grid" id="grid">
      <div class="card" data-name="caption" data-go="soon"><span>✍️</span>Caption</div>
      <div class="card" data-name="description" data-go="soon"><span>📦</span>Description</div>
      <div class="card" data-name="whatsapp ad" data-go="soon"><span>💬</span>WhatsApp Ad</div>
      <div class="card" data-name="calculators profit discount markup revenue" data-go="calc"><span>🧮</span>Calculators</div>
      <div class="card" data-name="festivals" data-go="soon"><span>🎉</span>Festivals</div>
      <div class="card" data-name="saved notes" data-go="saved"><span>💾</span>Saved</div>
    </div>
    <p id="empty" class="hidden muted">Koi tool nahi mila.</p>
    <p id="soon" class="hidden muted">Ye tool jaldi aayega. 🙂</p>
  </div>

  <div id="calc" class="hidden">
    <button class="back">← Back</button>
    <h2>Calculators</h2>
    <div class="tabs">
      <button class="tab active" data-tab="profit">Profit</button>
      <button class="tab" data-tab="disc">Discount</button>
      <button class="tab" data-tab="markup">Markup</button>
      <button class="tab" data-tab="rev">Revenue</button>
    </div>

    <div class="panel" id="p-profit">
      <label>Purchase cost (₹)</label>
      <input type="number" id="cost" inputmode="decimal" min="0">
      <label>Packaging (₹)</label>
      <input type="number" id="pack" inputmode="decimal" min="0">
      <label>Delivery (₹)</label>
      <input type="number" id="deliv" inputmode="decimal" min="0">
      <label>Other expenses (₹)</label>
      <input type="number" id="other" inputmode="decimal" min="0">
      <label>Selling price (₹)</label>
      <input type="number" id="sell" inputmode="decimal" min="0">
      <button class="btn" id="btn-profit">Calculate</button>
      <div id="res-profit" class="result hidden"></div>
    </div>

    <div class="panel hidden" id="p-disc">
      <label>Original price (₹)</label>
      <input type="number" id="dOrig" inputmode="decimal" min="0">
      <label>Discount (%)</label>
      <input type="number" id="dPct" inputmode="decimal" min="0" max="100">
      <button class="btn" id="btn-disc">Calculate</button>
      <div id="res-disc" class="result hidden"></div>
    </div>

    <div class="panel hidden" id="p-markup">
      <label>Product cost (₹)</label>
      <input type="number" id="mCost" inputmode="decimal" min="0">
      <label>Markup (%)</label>
      <input type="number" id="mPct" inputmode="decimal" min="0">
      <button class="btn" id="btn-markup">Calculate</button>
      <div id="res-markup" class="result hidden"></div>
    </div>

    <div class="panel hidden" id="p-rev">
      <label>Units sold</label>
      <input type="number" id="rUnits" inputmode="numeric" min="0">
      <label>Selling price per unit (₹)</label>
      <input type="number" id="rPrice" inputmode="decimal" min="0">
      <label>Total cost per unit (₹)</label>
      <input type="number" id="rCost" inputmode="decimal" min="0">
      <button class="btn" id="btn-rev">Calculate</button>
      <div id="res-rev" class="result hidden"></div>
    </div>
  </div>

  <div id="saved" class="hidden">
    <button class="back">← Back</button>
    <h2>Saved Content</h2>
    <input type="text" id="savedSearch" placeholder="Search saved...">
    <button class="btn" id="newNote">+ New</button>

    <div id="editor" class="editor hidden">
      <textarea id="noteText" maxlength="2000" rows="6" placeholder="Yaha likho..."></textarea>
      <div class="row">
        <button class="btn" id="saveNote">Save</button>
        <button class="btn ghost" id="cancelNote">Cancel</button>
      </div>
      <p id="editorMsg" class="muted"></p>
    </div>

    <div id="savedList"></div>
    <p id="savedEmpty" class="muted"></p>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="script.js"></script>
</body>
</html>
<script src="tools.js"></script>
<script src="extras.js"></script>
<script src="legal.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6c3df4">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  </script>
